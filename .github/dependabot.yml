version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'
          - 'bun'
      test-dependencies:
        patterns:
          - '@playwright*'
          - '@happy-dom/*'
          - '@tailwindcss/*'
    reviewers:
      - '*'
